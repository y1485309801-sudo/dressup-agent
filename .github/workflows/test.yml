name: Test

on:
  push:
    branches:
      - codex/outfit-agent-mvp
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check server.js
      - run: node --check src/app.js
      - name: Scan for committed credential values
        run: |
          if rg -n --glob '!*.example' --glob '!.env' '(AK|SK|API_KEY).{0,20}[=:].{0,4}[A-Za-z0-9_/-]{8,}'; then
            echo "Potential credential value found"
            exit 1
          fi
      - name: Start and smoke test
        run: |
          node server.js > server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/health > health.json; then break; fi
            sleep 1
          done
          node -e "const h=require('./health.json'); if(h.ok!==true) process.exit(1)"
          curl --fail --silent http://127.0.0.1:3001/ | grep -q 'DRESSUP AGENT'
